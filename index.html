<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YOLO 鏡頭辨識</title>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.24.3/dist/ort.webgpu.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <div class="stage">
    <canvas id="view"></canvas>
    <div id="placeholder">選擇鏡頭後按「開始辨識」<br>第一次會詢問是否允許使用攝影機</div>
  </div>
  <aside>
    <div>
      <h1>YOLO 鏡頭辨識</h1>
      <div class="sub">全部在你的電腦上運算，模型不會上傳　<a href="chat.html">→ 語言模型</a></div>
    </div>

    <div>
      <div class="label">模型</div>
      <div id="modelName" class="modelname">-</div>
      <div class="seg" style="margin-top:6px">
        <button id="pickModel">上傳 .onnx</button>
        <button id="pickNames">類別名稱</button>
      </div>
      <button id="resetModel" style="margin-top:6px" hidden>還原預設模型</button>
      <input type="file" id="fileModel" accept=".onnx" hidden>
      <input type="file" id="fileNames" accept=".txt,.json,.yaml,.yml" hidden>
      <div class="hint">也可以直接把 .onnx（和 .txt / .json / .yaml 類別檔）拖進視窗</div>
    </div>

    <div>
      <div class="label">鏡頭</div>
      <select id="camera"><option value="">（按開始後會列出所有鏡頭）</option></select>
    </div>
    <button id="start">開始辨識</button>

    <div>
      <div class="label">執行方式</div>
      <div class="seg" id="backend">
        <button data-b="webgpu">WebGPU（顯卡）</button>
        <button data-b="wasm">Wasm（CPU）</button>
      </div>
    </div>

    <div>
      <div class="row label"><span>信心門檻</span><span id="confV"></span></div>
      <input type="range" id="conf" min="0.1" max="0.9" step="0.05" value="0.4">
    </div>

    <div class="big">
      <div><b id="fps">-</b><span>FPS</span></div>
      <div><b id="inf">-</b><span>推論 ms</span></div>
    </div>

    <dl>
      <dt>前處理</dt><dd id="tPre">-</dd>
      <dt>後處理（NMS）</dt><dd id="tPost">-</dd>
      <dt>輸入尺寸</dt><dd id="sizeV">-</dd>
    </dl>

    <div>
      <div class="label">目前畫面中</div>
      <div id="objects"><div style="color:var(--muted)">尚無</div></div>
    </div>

    <div id="status">載入中…</div>
  </aside>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
